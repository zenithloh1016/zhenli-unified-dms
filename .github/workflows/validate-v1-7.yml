name: Validate V1.7 DMS Web and Android Assets
on:
  push:
    branches: [feature/edit-signing-requests-v1-7]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Test Master Listing Excel parser
        run: npm run test:import
      - run: npm run build
      - name: Install SSM PDF extraction utility
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Test and build Annual Return Generator
        run: |
          cd annual-return
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Validate Annual Return PDF app
        run: |
          cd annual-return-app
          npm install --no-audit --no-fund
          npm run build
