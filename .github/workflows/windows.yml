name: Build UNICOSEC Windows Installer
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
      - 'public/favicon.svg'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        working-directory: windows
        run: npm install --no-audit --no-fund
      - name: Compile branded Windows installer
        working-directory: windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:windows
      - name: Check installer output
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "windows/release/UNICOSEC-Setup-*.exe" -File)
          if ($installers.Count -eq 0) { throw "No installer produced" }
          $installers | ForEach-Object { Write-Host "$($_.Name): $($_.Length) bytes" }
      - name: Publish installable Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: UNICOSEC-Windows-Installer
          path: windows/release/UNICOSEC-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
