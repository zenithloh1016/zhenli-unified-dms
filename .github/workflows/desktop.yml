name: Build UNICOSEC Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop/**
      - .github/workflows/desktop.yml

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate application icons
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_icon.py
      - name: Install Windows desktop dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Test URL and Electron security
        shell: pwsh
        run: npm test
      - name: Package Windows installer and portable EXE
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win
      - name: Confirm downloadable Windows executables exist
        shell: pwsh
        run: |
          if (-not (Test-Path 'release/UNICOSEC-Setup-1.0.0-x64.exe')) { throw 'Installer missing' }
          if (-not (Test-Path 'release/UNICOSEC-Portable-1.0.0-x64.exe')) { throw 'Portable EXE missing' }
          Get-ChildItem release/*.exe | Select-Object Name,Length
      - name: Upload Windows desktop programs
        uses: actions/upload-artifact@v4
        with:
          name: UNICOSEC-Windows-Desktop
          path: |
            desktop/release/UNICOSEC-Setup-*.exe
            desktop/release/UNICOSEC-Portable-*.exe
          if-no-files-found: error
          retention-days: 90
      - name: Publish Windows desktop download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.0.0
          name: UNICOSEC Windows Desktop v1.0.0
          make_latest: true
          body: |
            Windows desktop application for UNICOSEC - Company Secretarial Management System.
            **Installer:** UNICOSEC-Setup-1.0.0-x64.exe
            **Portable:** UNICOSEC-Portable-1.0.0-x64.exe
            Uses the existing UNICOSEC account and Supabase data. Internet access is required.
            Unsigned build; Windows SmartScreen may ask for confirmation.
          files: |
            desktop/release/UNICOSEC-Setup-*.exe
            desktop/release/UNICOSEC-Portable-*.exe
          fail_on_unmatched_files: true
          overwrite_files: true
