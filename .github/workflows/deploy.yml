name: Deploy UNICOSEC Web and Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo 'Missing repository variable VITE_SUPABASE_URL' && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo 'Missing repository variable VITE_SUPABASE_ANON_KEY' && exit 1)
      - run: npm install --no-audit --no-fund
      - name: Test DMS import and statutory folder logic
        run: npm run test:import
      - name: Build website
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Build standalone Annual Return PDF website
        run: |
          cd annual-return
          npm install --no-audit --no-fund
          npm run test
          npm run build
          cd ..
          node scripts/bundle-annual-return.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Check configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || (echo 'Missing repository variable VITE_SUPABASE_URL' && exit 1)
          test -n "$VITE_SUPABASE_ANON_KEY" || (echo 'Missing repository variable VITE_SUPABASE_ANON_KEY' && exit 1)
      - run: npm install --no-audit --no-fund
      - name: Build bundled web assets
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Bundle Annual Return V1.5 into the DMS Android app
        run: |
          cd annual-return
          npm install --no-audit --no-fund
          npm run test
          npm run build
          cd ..
          node scripts/bundle-annual-return.mjs
      - name: Generate and synchronize Android app
        run: |
          npx cap add android
          npx cap sync android
          node scripts/generate-unicosec-icons.mjs android
          node scripts/install-native-pdf-saver.mjs .
      - name: Verify Add Company is bundled in Android
        run: |
          test -d android/app/src/main/assets/public/assets
          grep -R -F -q 'ml-add-form' android/app/src/main/assets/public/assets/
      - name: Build installable debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/UNICOSEC.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UNICOSEC-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/UNICOSEC.apk
          if-no-files-found: error
          retention-days: 30

  annual_return_android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Annual Return dependencies
        working-directory: annual-return
        run: npm install --no-audit --no-fund
      - name: Build Annual Return website for Android
        working-directory: annual-return
        run: npm run build
      - name: Set up Android project
        working-directory: annual-return
        run: |
          npx cap add android
          npx cap sync android
      - name: Register Android PDF Save As component
        run: node scripts/install-native-pdf-saver.mjs annual-return
      - name: Assemble Annual Return APK
        working-directory: annual-return/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: UNICOSEC-Annual-Return-PDF-Android-APK
          path: annual-return/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
