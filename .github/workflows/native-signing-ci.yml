name: Validate native sequential-signing backend
on:
  pull_request:
    paths:
      - 'supabase/functions/dms-sequential-signing/**'
      - 'supabase/native-sequential-signing.sql'
      - 'src/signing-supabase.js'
      - 'src/signing-public.js'
      - 'sign/**'
      - '.github/workflows/native-signing-ci.yml'
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check native signing function TypeScript and imports
        run: deno check supabase/functions/dms-sequential-signing/index.ts
      - name: Check signing browser JS syntax
        run: |
          node --check src/signing-supabase.js
          node --check src/signing-public.js
