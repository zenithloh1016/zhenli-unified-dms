name: Validate V1.7 DMS Web and Android Assets
on:
  push:
    branches: [feature/edit-signing-requests-v1-7]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Test Master Listing Excel parser
        run: npm run test:import
      - run: npm run build
      - name: Validate integrated Annual Return V1.5 and DMS bundled assets
        run: |
          cd annual-return
          npm install --no-audit --no-fund
          npm run test
          npm run build
          cd ..
          node scripts/bundle-annual-return.mjs
          test -f dist/annual-return/index.html
          test -f dist/annual-return/msic-2008.json
