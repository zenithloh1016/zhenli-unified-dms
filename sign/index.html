<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Secure electronic signature | ZHENLI</title>
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#243746;background:#f2f6fa}
*{box-sizing:border-box}body{margin:0;padding:24px 12px}
main{max-width:740px;margin:auto}
h1{font-size:25px}h2{font-size:20px}.panel{background:#fff;border:1px solid #d8e3ef;border-radius:13px;padding:24px;margin-bottom:16px}
label{display:block;margin:16px 0;font-weight:600}
input[type=text]{display:block;width:100%;font:inherit;padding:13px;border:1px solid #c6d5df;border-radius:7px;margin-top:8px}
button{border:0;border-radius:8px;padding:12px 18px;background:#184d7d;color:#fff;font-size:15px;cursor:pointer;margin:6px 8px 6px 0}
button.secondary{color:#184d7d;background:#edf5fb}
button:disabled{opacity:.5;cursor:not-allowed}
#signature{display:block;background:white;border:2px dashed #8aa2b3;border-radius:8px;width:100%;height:auto;touch-action:none;cursor:crosshair}
#alert{white-space:pre-wrap;color:#a02b2b;font-weight:600}
.subtle{color:#4d6071}footer{margin-top:18px;color:#5c6e7b;font-size:12px}
a{color:#104b79}p{line-height:1.55}
</style>
</head>
<body><main>
<div class="panel">
<h1>ZHENLI · Electronic Signing</h1>
<p class="subtle">Confidential document signing. No DMS account required.</p>
<div id="alert" role="alert"></div>
<div id="content"><p>Retrieving your signing request…</p></div>
</div>
<footer>ZHENLI CONSULTANCY SERVICES SDN BHD · Signing access is limited to the intended recipient. Contact the sender if you did not expect this document.</footer>
</main><script type="module" src="/src/signing-public.js"></script></body></html>
